<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administration — West Pac Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b2545'/%3E%3Cpath d='M16 44 L32 18 L48 44' stroke='%23d4af37' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="toast-wrap" id="toastWrap"></div>
<div class="admin-page">
  <form class="admin-box" id="loginForm">
    <span class="badge"><i class="fa-solid fa-lock"></i> Restricted</span>
    <h1>Administration Console</h1>
    <p class="sub">West Pac Global · authorised personnel only</p>

    <div class="field"><label for="loginUsername">Operator ID</label><input id="loginUsername" autocomplete="username" placeholder="Operator ID" autofocus></div>
    <div class="field" style="margin-bottom:20px;"><label for="loginPassword">Passphrase</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Passphrase"></div>
    <button class="btn btn-amber btn-block" id="loginBtn" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Authenticate</button>

    <div class="admin-foot">All access is logged and monitored.</div>
  </form>
</div>
<script src="/js/api.js"></script>
<script>
if (
  !Session.impersonating &&
  Session.token &&
  Session.role === 'admin'
) {
  window.location.href = '/admin.html';
}

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type==='err'?' err':type==='ok'?' ok':'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3600);
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!username || !password){ toast('Enter your operator ID and passphrase','err'); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  try{
    const data = await api('/auth/login', { method:'POST', body:{ role:'admin', username, password } });
    Session.set(data.token, data.role, data.name);
    window.location.href = '/admin.html';
  }catch(err){
    toast(err.message, 'err');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
